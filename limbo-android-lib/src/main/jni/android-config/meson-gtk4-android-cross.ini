# GTK4 (gtk4android) cross-compilation template for Android
# Generated from this template by the Makefile (android-limbo-build.mak)
# Modeled on gtk-android-builder (pixiewood) android.cross + glib cross template

[binaries]
c = '/home/huang/android-ndk-r25c/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang'
cpp = '/home/huang/android-ndk-r25c/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++'
ar = '/home/huang/android-ndk-r25c/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
as = '/home/huang/android-ndk-r25c/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-as'
ranlib = '/home/huang/android-ndk-r25c/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ranlib'
ld = '/home/huang/android-ndk-r25c/toolchains/llvm/prebuilt/linux-x86_64/bin/ld'
strip = '/home/huang/android-ndk-r25c/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'

[built-in options]
prefix = '/mnt/c/Users/Huang/AndroidStudioProjects/limbo/limbo-android-lib/src/main/jni/gtk4android/android-install/arm64-v8a'
libdir = 'lib'
bindir = 'bin'
buildtype = 'release'
default_library = 'shared'
c_link_args = ['-Wl,--build-id=sha1']
cpp_link_args = ['-Wl,--build-id=sha1']

# NOTE: no sys_root here on purpose.  Setting it would make pkg-config prefix
# every -I/-L with the sysroot, which breaks the absolute paths of the jni
# shared libs (glib/pixman/libffi) that the GTK build consumes.
[host_machine]
system = 'android'
cpu_family = 'aarch64'
cpu = 'aarch64'
endian = 'little'

# ---- per-subproject options (from pixiewood android.cross) ----
[glib:built-in options]
default_library = 'shared'

[glib:project options]
tests = false
sysprof = 'disabled'

[cairo:project options]
tests = 'disabled'

[fribidi:project options]
bin = false
tests = false

[harfbuzz:project options]
tests = 'disabled'
introspection = 'disabled'
docs = 'disabled'
utilities = 'disabled'

[gdk-pixbuf:project options]
builtin_loaders = ['all']
glycin = 'disabled'
documentation = false
# The gdk-pixbuf android loader uses the AImageDecoder API (Android 11/API 30+),
# which is unavailable on our android-24 target. The classic libpng/libjpeg/
# libtiff loaders cover the same formats, so disable it here.
android = 'disabled'

[gtk:project options]
android-backend = true
introspection = 'disabled'
media-gstreamer = 'disabled'
build-demos = false
build-testsuite = false
build-examples = false
build-tests = false
