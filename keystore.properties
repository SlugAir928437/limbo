# ---------------------------------------------------------------------------
# Release 签名凭据
#
# 本文件【有意提交到仓库】（.gitignore 中未忽略），目的：
#   让 CI（.github/workflows/release.yml）与本地 Android Studio / gradlew
#   使用同一把发布密钥，保证历次发布的 APK 签名一致、可以互相覆盖升级。
#
# 密码 123456 为项目约定的公开值（workflow 文件里同样明文可见），不含机密。
# 请勿把本文件加进 .gitignore，否则 CI 与本地会各签各的。
#
# 密钥库：keystore/release.jks
#   别名    FreshingAir
#   算法    RSA 2048（SHA384withRSA）
#   有效期  10000 天（至 2054-02-16）
#   SHA-256 1E:5F:2B:C9:0B:FD:53:42:21:F9:E8:A8:9E:1B:BC:FD:01:63:E9:4C:2F:D3:7D:E9:C3:5C:8F:C3:94:E2:DE:E7
#
# storeFile 路径相对于工程根目录（也可写绝对路径）。
# ---------------------------------------------------------------------------
storeFile=keystore/release.jks
storePassword=123456
keyAlias=FreshingAir
keyPassword=123456
