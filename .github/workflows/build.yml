name: build
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      build_guest:
        description: 'QEMU 模拟架构（单选；x86/arm 使用官方 QEMU，ia64 使用 IA-64 fork）'
        required: true
        default: 'ia64-softmmu'
        type: choice
        options:
          - i386-softmmu
          - x86_64-softmmu
          - arm-softmmu
          - aarch64-softmmu
          - ia64-softmmu
      build_host:
        description: 'Android 设备 ABI（单选）'
        required: true
        default: 'arm64-v8a'
        type: choice
        options:
          - armeabi-v7a
          - arm64-v8a
          - x86
          - x86_64

jobs:
  build_linux:
    name: Linux Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 检出代码
        uses: actions/checkout@v6
        with:
          submodules: false

      # 源码获取 / 补丁应用统一收进 jni/Makefile 的 fetch 目标（qemu/gtk4android
      # 已取消 git submodule，全部由 make fetch 克隆）：
      #   x86/arm 模拟架构  -> 下载官方 QEMU v11.0.0 + 应用 qemu-v11.0.0.patch
      #   ia64              -> 下载 IA-64 fork（FreshingAir/qemu-system-ia64）
      #   gtk4android       -> 下载 SlugAir928437/gtk4android
      # 下方仅保留环境准备与构建，构建前的依赖下载全部由 `make limbo -> make fetch` 完成。
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17
      - name: Setup Android SDK Tools
        uses: android-actions/setup-android@v3.2.1
        with:
          packages: 'ndk;25.2.9519653'

      - name: 安装依赖
        run: |
          sudo apt-get install make autoconf automake git binutils python3 \
            libtool-bin pkg-config flex bison gettext texinfo rsync \
            gtk-doc-tools python3-pip ninja-build meson libglib2.0-dev
          # ubuntu-latest 自带的 meson (1.3.2) 太旧: glib 2.89.3 要求 >= 1.4.0
          sudo python3 -m pip install --upgrade 'meson>=1.4.0'
          # verify the host glib tools are present: the Makefile's glib target
          # replaces the Android-ELF tools in the installed bindir with these
          # (fail early instead of mid-build)
          command -v glib-compile-resources glib-compile-schemas glib-genmarshal glib-mkenums gdbus-codegen

      # 依赖源码（glib/libffi/pixman/SDL2）与 QEMU/gtk4android 源码均已由
      # jni/Makefile 的 fetch 目标在 `make limbo` 时下载并应用补丁，此处不再克隆。
      - name: 缓存 meson wrap 下载 (pcre2 等)
        uses: actions/cache@v4
        with:
          path: ~/.cache/meson
          key: meson-wrap-${{ runner.os }}

      - name: Build QEMU
        run: |
          cd limbo-android-lib/src/main/jni
          export NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/25.2.9519653
          export PATH=$PATH:$NDK_ROOT
          export BUILD_THREADS=$(nproc)
          export BUILD_GUEST=${{ github.event.inputs.build_guest || 'ia64-softmmu' }}
          export BUILD_HOST=${{ github.event.inputs.build_host || 'arm64-v8a' }}
          export USE_GTK=true
          # 完整构建链: ffi -> glib -> pixman -> gtk(gtk4android) -> qemu -> limbo
          make limbo

      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: 上传apk构建产物
        uses: actions/upload-artifact@v7.0.1
        with:
          name: build_apk_output.zip
          path: |
            limbo-android-ia64/build/outputs/apk/**/*.apk
            limbo-android-arm/build/outputs/apk/**/*.apk
            limbo-android-x86/build/outputs/apk/**/*.apk
