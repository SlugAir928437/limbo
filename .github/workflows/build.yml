name: build
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      build_host:
        description: 'Android 设备 ABI（单选）'
        required: true
        default: 'arm64-v8a'
        type: choice
        options:
          - arm64-v8a
          - x86_64
      build_edk2:
        description: '是否编译 EDK2 客户机 UEFI 固件（默认否）'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      use_sdl:
        description: '是否启用 SDL2 显示后端（关闭则 QEMU 以 --disable-sdl 配置）'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      use_gtk:
        description: '是否编译 GTK4 显示后端（关闭可显著缩短构建时间；关闭后 VirGL 也会自动关闭）'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      use_spice:
        description: '是否编译 SPICE 栈（只服务 qxl-vga；ia64 矩阵始终跳过）'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      use_angle:
        description: '是否编译 ANGLE 转译层（GN + depot_tools 构建，会额外拉取约 1~2GB DEPS 并显著延长构建时间）'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      use_zink:
        description: '是否编译 Mesa zink 渲染后端（GL over Vulkan，随包分发 libEGL_zink.so 等；关闭则设置里该后端回退系统 GLES）'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  build_linux:
    name: Linux Build (${{ matrix.name }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # 两条并行构建路径（matrix，fail-fast: false 使其互不取消）：
    #   official -> 4 个官方 QEMU v11.0.0 客户机架构（x86_64 / i386 / arm /
    #               aarch64）合并为【一条任务】：QEMU 的 --target-list 支持逗号
    #               分隔的多目标，因此一次依赖栈构建 + 一次 QEMU 配置构建即可
    #               同时产出这四个架构，不再像过去那样各自重复编译整条依赖栈。
    #   ia64     -> IA-64 fork（源码树与官方不同，必须单独一条；Makefile 会自动
    #               跳过 spice / VirGL）
    # 构建参数集中在这里：每一步都会继承同样的环境，等价于原来单步
    # `make limbo` 里 export 的那些变量。NDK_ROOT / BUILD_THREADS 依赖运行时的
    # runner 环境，无法在 job env 里求值，由下方「准备构建环境」步骤写入
    # $GITHUB_ENV 后再供各步骤使用。
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: official
            guest: x86_64-softmmu,i386-softmmu,arm-softmmu,aarch64-softmmu
          - name: ia64
            guest: ia64-softmmu
    env:
      BUILD_GUEST: ${{ matrix.guest }}
      BUILD_HOST: ${{ github.event.inputs.build_host || 'arm64-v8a' }}
      # SDL / GTK / SPICE / ANGLE / zink 由手动触发时的五个开关决定；push /
      # pull_request 事件没有 inputs，统一回落到默认值（全部开启）。
      USE_SDL: ${{ github.event.inputs.use_sdl || 'true' }}
      USE_GTK: ${{ github.event.inputs.use_gtk || 'true' }}
      USE_SPICE: ${{ github.event.inputs.use_spice || 'true' }}
      # ANGLE（google/angle）：默认【编译】。ANGLE 只有 GN 工程，构建链是
      # depot_tools(gclient sync 拉 DEPS) -> gn gen -> ninja，见 jni/Makefile 的
      # fetch-angle / config-angle / angle；产物 libEGL_angle.so /
      # libGLESv2_angle.so / libGLESv1_CM_angle.so 会随 APK 打包，供运行时把
      # libepoxy 的 EGL/GLES 入口切到 ANGLE（GLES -> Vulkan 转译）。
      # ia64 任务在 Makefile 里强制 USE_ANGLE=false（没有 virtio-gpu-gl-pci）。
      USE_ANGLE: ${{ github.event.inputs.use_angle || 'true' }}
      # virglrenderer 需要 gtk4android 安装出来的 libepoxy（CONFIG_OPENGL），
      # 因此 USE_GTK=false 时把 VirGL 一起自动关掉，避免缺 epoxy 导致链接失败。
      USE_VIRGL: ${{ github.event.inputs.use_gtk == 'false' && 'false' || 'true' }}
      # Mesa zink（GL/GLES over Vulkan）：默认【编译】。源码由 `make fetch`
      # （fetch-mesa：官方 release 压缩包）准备，随后 config-mesa / mesa 产出
      # libEGL_zink.so / libGLESv2_zink.so 等并落到 jniLibs，供运行时把 libepoxy
      # 的 EGL/GLES 入口切到 Mesa zink。zink 只是 virgl 的渲染后端，所以
      # USE_VIRGL=false（GTK 关闭）时也一并关掉；ia64 任务由 Makefile 强制关闭。
      USE_VIRGL_ZINK: ${{ github.event.inputs.use_gtk == 'false' && 'false' || github.event.inputs.use_zink || 'true' }}
      # EDK2 客户机 UEFI 固件默认【不编译】；需要时在手动触发时把 build_edk2
      # 选为 true（Makefile 侧对应 USE_EDK2=true）。
      USE_EDK2: ${{ github.event.inputs.build_edk2 || 'false' }}
      LOGDIR: ${{ github.workspace }}/ci-logs
    steps:
      - name: 检出代码
        uses: actions/checkout@v6
        with:
          submodules: false

      # 源码获取统一收进 jni/Makefile 的 fetch 目标（qemu/gtk4android 已取消 git
      # submodule，全部由 `make fetch` 克隆）；QEMU 的补丁【不再在构建时应用】：
      #   x86/arm 模拟架构  -> 克隆 SlugAir928437/QEMU（官方 v11.0.0 + Limbo 全部
      #                        补丁已经打好的源码仓库）
      #   ia64              -> 下载 IA-64 fork（FreshingAir/qemu-system-ia64），
      #                        它自己的 Android 适配补丁仍由 fetch-qemu 应用
      #   gtk4android       -> 下载 SlugAir928437/gtk4android
      # 构建链被拆成下面这些独立步骤：fetch -> ndk -> 每个依赖各自的
      # config-X + X（libffi / glib / pixman / slirp / spice / gtk / virglrenderer，
      # 保持 jni/Makefile 里 config-deps -> deps 的相对次序）-> config-angle ->
      # angle -> config-mesa -> mesa -> config-qemu -> qemu -> ncat -> install。
      # 其中 spice / gtk / virgl / angle / mesa 五组步骤会按 use_spice / use_gtk /
      # use_angle / use_zink 四个开关（env 里的 USE_*）显示为 skipped，不影响其余步骤。
      # EDK2 客户机 UEFI 固件（make edk2）不再是默认步骤：只有当 USE_EDK2=true
      # （手动触发时 build_edk2=true）时才会执行，见文末条件步骤。
      # 拆分的目的是让失败点直接定位到具体阶段（Actions 里一眼可见是哪一步、
      # 甚至哪个依赖挂了），每步输出同时 tee 一份完整日志到 ci-logs/，
      # 失败时整体上传为 artifact。
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17
      - name: Setup Android SDK Tools
        uses: android-actions/setup-android@v3.2.1
        with:
          packages: 'ndk;28.2.13676358'

      - name: 安装依赖
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # runner 预置的 apt 索引会落后于镜像源：镜像上旧版本的 deb 已被清理，
          # 直接 install 就会 404 Not Found（libglib2.0-dev / libglib2.0-dev-bin /
          # libgirepository-2.0-0）。所以必须先刷新索引；镜像偶发不同步时重试，
          # 已下架的个别包用 --fix-missing 兜底（后面 command -v 会校验工具是否齐全）。
          for i in 1 2 3; do
            sudo -E apt-get update -y && break
            echo ">> apt-get update 第 ${i} 次失败，5s 后重试"
            sleep 5
          done
          sudo -E apt-get install -y --fix-missing \
            make autoconf automake git binutils python3 \
            libtool-bin pkg-config flex bison gettext texinfo rsync patch \
            gtk-doc-tools python3-pip ninja-build meson libglib2.0-dev \
            nasm acpica-tools uuid-dev device-tree-compiler gcc-multilib \
            xz-utils patchelf python3-mako glslang-tools
          # EDK2 固件的交叉编译器（x86/x86_64 用宿主 gcc；Arm/Aarch64 需要交叉
          # 工具链）。EDK2 默认不编译，只有 USE_EDK2=true 时才安装这两个包：
          # 32 位 ARM 的软浮点工具链在部分发行版上缺失，故容错安装；真的缺工具链时
          # make edk2 会在对应架构上给出明确报错，而不是静默编出错误固件。
          if [ "$USE_EDK2" = "true" ]; then
            sudo -E apt-get install -y --fix-missing gcc-aarch64-linux-gnu || true
            sudo -E apt-get install -y --fix-missing gcc-arm-linux-gnueabi \
              || sudo -E apt-get install -y --fix-missing gcc-arm-linux-gnueabihf || true
          else
            echo ">> USE_EDK2=${USE_EDK2}：跳过 EDK2 交叉工具链安装"
          fi
          # ubuntu-latest 自带的 meson (1.3.2) 太旧: glib 2.89.3 要求 >= 1.4.0
          # （mako 已随上面的 python3-mako 安装，Mesa/zink 的代码生成需要它；
          #  glslang-tools 提供 glslangValidator，Mesa 的 Vulkan/zink 内部着色器
          #  编译需要它，否则 meson setup 在 meson.build 里直接报找不到程序）
          sudo python3 -m pip install --upgrade 'meson>=1.4.0'
          # verify the host glib tools are present: the Makefile's glib target
          # replaces the Android-ELF tools in the installed bindir with these
          # (fail early instead of mid-build)
          command -v glib-compile-resources glib-compile-schemas glib-genmarshal glib-mkenums gdbus-codegen glslangValidator

      # ANGLE 的 DEPS（chromium build/、vulkan-deps、SwiftShader、NDK、clang 等）
      # 首次 gclient sync 要占 4GB 左右，runner 自带的预装工具先清掉腾空间。
      - name: 释放磁盘空间（ANGLE DEPS 用）
        if: env.USE_ANGLE == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /opt/hostedtoolcache/CodeQL \
            /usr/local/lib/android/sdk/emulator /usr/local/lib/android/sdk/system-images \
            /opt/ghc /usr/local/lib/node_modules
          sudo apt-get clean
          df -h /

      # 依赖源码（glib/libffi/pixman/SDL2）与 QEMU/gtk4android 源码均已由
      # 第 1 步 `make fetch` 下载；QEMU 那份是【已打好补丁】的仓库，构建时不再
      # 执行 git apply。
      - name: 缓存 meson wrap 下载 (pcre2 等)
        uses: actions/cache@v4
        with:
          path: ~/.cache/meson
          key: meson-wrap-${{ runner.os }}-${{ matrix.name }}

      - name: 准备构建环境
        run: |
          NDK_VERSION=28.2.13676358
          echo "NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "BUILD_THREADS=$(nproc)" >> "$GITHUB_ENV"
          echo "PATH=$PATH:${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          mkdir -p "$LOGDIR"
          echo ">> BUILD_GUEST=${BUILD_GUEST} BUILD_HOST=${BUILD_HOST} USE_GTK=${USE_GTK} USE_VIRGL=${USE_VIRGL} USE_ANGLE=${USE_ANGLE} USE_VIRGL_ZINK=${USE_VIRGL_ZINK} USE_EDK2=${USE_EDK2}"
          echo ">> NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}"

      - name: 1/22 拉取源码（make fetch）
        working-directory: limbo-app/src/main/jni
        run: |
          set -o pipefail
          make fetch 2>&1 | tee "$LOGDIR/01-fetch.log"

      - name: 2/22 生成 NDK 中间目录（make ndk）
        working-directory: limbo-app/src/main/jni
        run: |
          set -o pipefail
          make ndk 2>&1 | tee "$LOGDIR/02-ndk.log"

      - name: 3/22 配置 libffi（make config-ffi）
        working-directory: limbo-app/src/main/jni
        run: |
          set -o pipefail
          make config-ffi 2>&1 | tee "$LOGDIR/03-config-ffi.log"

      - name: 4/22 构建 libffi（make ffi）
        working-directory: limbo-app/src/main/jni
        run: |
          set -o pipefail
          make ffi 2>&1 | tee "$LOGDIR/04-ffi.log"

      - name: 5/22 配置 glib（make config-glib）
        working-directory: limbo-app/src/main/jni
        run: |
          set -o pipefail
          make config-glib 2>&1 | tee "$LOGDIR/05-config-glib.log"

      - name: 6/22 构建 glib（make glib）
        working-directory: limbo-app/src/main/jni
        run: |
          set -o pipefail
          make glib 2>&1 | tee "$LOGDIR/06-glib.log"

      - name: 7/22 配置 pixman（make config-pixman）
        working-directory: limbo-app/src/main/jni
        run: |
          set -o pipefail
          make config-pixman 2>&1 | tee "$LOGDIR/07-config-pixman.log"

      - name: 8/22 构建 pixman（make pixman）
        working-directory: limbo-app/src/main/jni
        run: |
          set -o pipefail
          make pixman 2>&1 | tee "$LOGDIR/08-pixman.log"

      - name: 9/22 配置 libslirp（make config-slirp）
        working-directory: limbo-app/src/main/jni
        run: |
          set -o pipefail
          make config-slirp 2>&1 | tee "$LOGDIR/09-config-slirp.log"

      - name: 10/22 构建 libslirp（make slirp）
        working-directory: limbo-app/src/main/jni
        run: |
          set -o pipefail
          make slirp 2>&1 | tee "$LOGDIR/10-slirp.log"

      # IA-64 客户机跳过 spice 栈与 VirGL/virtio-gpu 栈（见 jni/Makefile）：
      # spice 只服务于 qxl-vga，IA-64 的 QEMU 以 --disable-spice 配置，故这两步
      # 在 BUILD_GUEST=ia64-softmmu 时不执行。
      - name: 11/22 配置 spice 栈（make config-spice）
        if: env.USE_SPICE == 'true' && env.BUILD_GUEST != 'ia64-softmmu'
        working-directory: limbo-app/src/main/jni
        run: |
          set -o pipefail
          make config-spice 2>&1 | tee "$LOGDIR/11-config-spice.log"

      - name: 12/22 构建 spice 栈（make spice）
        if: env.USE_SPICE == 'true' && env.BUILD_GUEST != 'ia64-softmmu'
        working-directory: limbo-app/src/main/jni
        run: |
          set -o pipefail
          make spice 2>&1 | tee "$LOGDIR/12-spice.log"

      - name: 13/22 配置 GTK4（make config-gtk）
        if: env.USE_GTK == 'true'
        working-directory: limbo-app/src/main/jni
        run: |
          set -o pipefail
          make config-gtk 2>&1 | tee "$LOGDIR/13-config-gtk.log"

      - name: 14/22 构建 GTK4（make gtk）
        if: env.USE_GTK == 'true'
        working-directory: limbo-app/src/main/jni
        run: |
          set -o pipefail
          make gtk 2>&1 | tee "$LOGDIR/14-gtk.log"

      # virglrenderer 依赖 gtk4android 安装出来的 libepoxy，必须排在 gtk 之后，
      # 因此它在 Makefile 的 limbo 目标里也是独立于 config-deps/deps 的一环。
      - name: 15/22 配置 virglrenderer（make config-virgl）
        if: env.USE_VIRGL == 'true' && env.BUILD_GUEST != 'ia64-softmmu'
        working-directory: limbo-app/src/main/jni
        run: |
          set -o pipefail
          make config-virgl 2>&1 | tee "$LOGDIR/15-config-virgl.log"

      - name: 16/22 构建 virglrenderer（make virgl）
        if: env.USE_VIRGL == 'true' && env.BUILD_GUEST != 'ia64-softmmu'
        working-directory: limbo-app/src/main/jni
        run: |
          set -o pipefail
          make virgl 2>&1 | tee "$LOGDIR/16-virgl.log"

      # ANGLE（google/angle）：USE_ANGLE=true 时编译（默认开，ia64 任务由
      # Makefile 强制关闭）。ANGLE 只有 GN 工程：源码与 DEPS 由第 1 步的
      # `make fetch`（fetch-angle：克隆 depot_tools + gclient sync）准备好，
      # 这里依次执行 gn gen（config-angle）与 ninja（angle），产物
      # libEGL_angle.so / libGLESv2_angle.so / libGLESv1_CM_angle.so 直接落到
      # jniLibs，随后由 Gradle 打进 APK。
      - name: 16a/22 配置 ANGLE（make config-angle）
        if: env.USE_ANGLE == 'true' && env.BUILD_GUEST != 'ia64-softmmu'
        working-directory: limbo-app/src/main/jni
        run: |
          set -o pipefail
          make config-angle 2>&1 | tee "$LOGDIR/16a-config-angle.log"

      - name: 16b/22 构建 ANGLE（make angle）
        if: env.USE_ANGLE == 'true' && env.BUILD_GUEST != 'ia64-softmmu'
        working-directory: limbo-app/src/main/jni
        run: |
          set -o pipefail
          make angle 2>&1 | tee "$LOGDIR/16b-angle.log"

      # Mesa zink（GL/GLES -> Vulkan）：USE_VIRGL_ZINK=true 时编译（默认开；
      # GTK 关闭时 env 里自动变 false，ia64 任务由 Makefile 强制关闭）。
      # 源码由第 1 步 `make fetch`（fetch-mesa）下载，这里执行 meson setup
      # （config-mesa）与 ninja + 改名部署（mesa），产物 libEGL_zink.so /
      # libGLESv1_CM_zink.so / libGLESv2_zink.so / libgallium_dri.so 直接落到
      # jniLibs，随后由 Gradle 打进 APK。
      - name: 16c/22 配置 Mesa zink（make config-mesa）
        if: env.USE_VIRGL_ZINK == 'true' && env.BUILD_GUEST != 'ia64-softmmu'
        working-directory: limbo-app/src/main/jni
        run: |
          set -o pipefail
          make config-mesa 2>&1 | tee "$LOGDIR/16c-config-mesa.log"

      - name: 16d/22 构建 Mesa zink（make mesa）
        if: env.USE_VIRGL_ZINK == 'true' && env.BUILD_GUEST != 'ia64-softmmu'
        working-directory: limbo-app/src/main/jni
        run: |
          set -o pipefail
          make mesa 2>&1 | tee "$LOGDIR/16d-mesa.log"

      - name: 17/22 配置 QEMU（make config-qemu）
        working-directory: limbo-app/src/main/jni
        run: |
          set -o pipefail
          make config-qemu 2>&1 | tee "$LOGDIR/17-config-qemu.log"

      - name: 18/22 构建 QEMU 并部署库（make qemu）
        working-directory: limbo-app/src/main/jni
        run: |
          set -o pipefail
          make qemu 2>&1 | tee "$LOGDIR/18-qemu.log"

      - name: 19/22 构建 ncat（make ncat）
        working-directory: limbo-app/src/main/jni
        run: |
          set -o pipefail
          make ncat 2>&1 | tee "$LOGDIR/19-ncat.log"

      - name: 20/22 同步 jniLibs（make install）
        working-directory: limbo-app/src/main/jni
        run: |
          set -o pipefail
          make install 2>&1 | tee "$LOGDIR/20-install.log"

      # EDK2（TianoCore）客户机 UEFI 固件。默认【不编译】：只有 USE_EDK2=true
      # （手动触发时将 build_edk2 选为 true）时才执行。固件与 host ABI 无关、只与
      # 客户机架构有关，所以按 BUILD_GUEST 只构建对应架构（IA32/X64/ARM/AARCH64），
      # 产物部署到 assets/roms/ 并随 APK 打包（见 jni/Makefile 的 edk2 目标与
      # jni/edk2/make_edk2.sh；主标签固定 edk2-stable202508，不含 IA64）。
      - name: 构建 EDK2 客户机固件（make edk2）
        if: env.USE_EDK2 == 'true'
        working-directory: limbo-app/src/main/jni
        run: |
          set -o pipefail
          make edk2 2>&1 | tee "$LOGDIR/21-edk2.log"

      # make install 末尾会把所有 .so 构建产物的符号表输出到
      # obj/symbols/<abi>/（未 strip 的 .so 副本 + .sym/.dynsym 文本），
      # 单独上传一份，供崩溃栈符号化用（ndk-stack / llvm-symbolizer / addr2line）。
      # 只在这个 job 成功跑到 install 时才会执行，所以缺失即视为构建回归。
      - name: 上传符号表（obj/symbols）
        uses: actions/upload-artifact@v7.0.1
        with:
          name: symbols-${{ matrix.name }}-${{ env.BUILD_HOST }}
          path: limbo-app/src/main/obj/symbols/${{ env.BUILD_HOST }}/
          if-no-files-found: error

      - name: 显示失败阶段的日志尾部
        if: failure()
        run: |
          for log in "$LOGDIR"/*.log; do
            [ -e "$log" ] || continue
            echo "::group::$log（末尾 200 行）"
            tail -200 "$log"
            echo "::endgroup::"
          done

      - name: 上传构建日志（失败诊断用）
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: qemu_build_log-${{ matrix.name }}
          path: ci-logs/

      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: 上传apk构建产物
        uses: actions/upload-artifact@v7.0.1
        with:
          name: build_apk_output-${{ matrix.name }}.zip
          path: |
            limbo-app/build/outputs/apk/**/*.apk
