plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.compose)
}

android {
    namespace 'com.limbo.emu'
    compileSdk {
        version = release(37)
    }

    defaultConfig {
        applicationId "com.limbo.emu"
        minSdk 24
        targetSdk 37
        versionCode 10000
        versionName "1.0.0"

        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
            assets.srcDirs = ['src/main/assets', 'src/main/assets2']
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildFeatures {
        compose = true
        buildConfig = true
        aidl = true
    }
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            jniDebuggable true
        }
    }
}

dependencies {
    implementation libs.androidx.documentfile

    // 核心兼容库（版本统一）
    implementation libs.androidx.appcompat
    implementation libs.material

    // Compose (Jetpack Compose) —— 主题与组件由 Miuix 提供，不再依赖 Compose Material 3
    implementation platform(libs.compose.bom)
    implementation libs.compose.ui
    implementation libs.compose.ui.graphics
    implementation libs.compose.ui.tooling.preview
    implementation libs.androidx.activity.compose
    debugImplementation libs.compose.ui.tooling

    // Miuix：小米 HyperOS / MIUI 设计系统（Compose），承载应用主题与 UI 组件
    implementation libs.miuix.ui
    implementation libs.miuix.preference

    // 注解
    implementation libs.annotations

    implementation libs.xxpermissions

    implementation libs.markwon.core

    // 内存泄露检测
    androidTestImplementation libs.leakcanary.android.instrumentation
    debugImplementation libs.leakcanary.android

    implementation project(':limbo-app:filepicker')
}
tasks.configureEach { task ->
    if (task.name.startsWith('compile') && task.name.endsWith('Ndk')) {
        task.enabled = false
    }
}