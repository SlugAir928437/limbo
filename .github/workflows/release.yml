name: release

# 手动触发的发版工作流：
#   official -> 官方 QEMU v11.0.0 的 4 个客户机架构（x86_64 / i386 / arm /
#               aarch64），QEMU 的 --target-list 支持多目标，一次构建全部产出
#   ia64     -> IA-64 fork（源码树不同，单独一条；Makefile 会自动跳过
#               spice / VirGL）
# 两条任务各自构建原生库并打包 Release APK，全部成功后在 GitHub 上创建
# Release、上传 APK 与 SHA-256 校验和。
# 原生库构建沿用 build.yml 的 20 步拆分（fetch -> ndk -> 各依赖 config-X + X
# -> config-qemu -> qemu -> ncat -> install），失败时能直接定位到具体阶段。
on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 1.2.0，同时用作 Release 标签与 APK versionName）'
        required: true
        type: string

permissions:
  contents: read

env:
  NDK_VERSION: '28.2.13676358'
  BUILD_HOST: arm64-v8a
  # 发布签名（可选）：在仓库 Secrets 里配置
  #   RELEASE_KEYSTORE_BASE64     密钥库文件的 base64（单行）
  #   RELEASE_KEYSTORE_PASSWORD   密钥库密码
  #   RELEASE_KEY_ALIAS           密钥别名
  #   RELEASE_KEY_PASSWORD        密钥密码（不配置时与密钥库密码相同）
  # 未配置 RELEASE_KEYSTORE_BASE64 时退回 Android 调试密钥签名，保证 APK 仍可安装。
  KS_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
  KS_STORE_PASS: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
  KS_KEY_PASS: ${{ secrets.RELEASE_KEY_PASSWORD }}

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: official
            guest: x86_64-softmmu,i386-softmmu,arm-softmmu,aarch64-softmmu
          - name: ia64
            guest: ia64-softmmu
    env:
      BUILD_GUEST: ${{ matrix.guest }}
      USE_GTK: 'true'
      USE_VIRGL: 'true'
      # 固件已随仓库提交在 assets2/roms，发版时无需重新编译 EDK2。
      USE_EDK2: 'false'
      LOGDIR: ${{ github.workspace }}/ci-logs
    steps:
      - name: 检出代码
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Android SDK Tools
        uses: android-actions/setup-android@v3.2.1
        with:
          packages: 'ndk;${{ env.NDK_VERSION }}'

      - name: 安装依赖
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # runner 预置的 apt 索引会落后于镜像源，先刷新（失败重试），
          # 已下架的个别包用 --fix-missing 兜底。
          for i in 1 2 3; do
            sudo -E apt-get update -y && break
            echo ">> apt-get update 第 ${i} 次失败，5s 后重试"
            sleep 5
          done
          sudo -E apt-get install -y --fix-missing \
            make autoconf automake git binutils python3 \
            libtool-bin pkg-config flex bison gettext texinfo rsync patch \
            gtk-doc-tools python3-pip ninja-build meson libglib2.0-dev \
            nasm acpica-tools uuid-dev device-tree-compiler gcc-multilib
          # ubuntu-latest 自带的 meson 太旧：glib 要求 >= 1.4.0
          sudo python3 -m pip install --upgrade 'meson>=1.4.0'
          command -v glib-compile-resources glib-compile-schemas glib-genmarshal glib-mkenums gdbus-codegen

      - name: 缓存 meson wrap 下载 (pcre2 等)
        uses: actions/cache@v4
        with:
          path: ~/.cache/meson
          key: meson-wrap-${{ runner.os }}-${{ matrix.name }}

      - name: 准备构建环境
        run: |
          echo "NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "BUILD_THREADS=$(nproc)" >> "$GITHUB_ENV"
          echo "PATH=$PATH:${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          mkdir -p "$LOGDIR"
          echo ">> BUILD_GUEST=${BUILD_GUEST} BUILD_HOST=${BUILD_HOST} USE_GTK=${USE_GTK} USE_VIRGL=${USE_VIRGL}"

      - name: 1/20 拉取源码（make fetch）
        working-directory: limbo-app/src/main/jni
        run: |
          set -o pipefail
          make fetch 2>&1 | tee "$LOGDIR/01-fetch.log"

      - name: 2/20 生成 NDK 中间目录（make ndk）
        working-directory: limbo-app/src/main/jni
        run: |
          set -o pipefail
          make ndk 2>&1 | tee "$LOGDIR/02-ndk.log"

      - name: 3/20 配置 libffi（make config-ffi）
        working-directory: limbo-app/src/main/jni
        run: |
          set -o pipefail
          make config-ffi 2>&1 | tee "$LOGDIR/03-config-ffi.log"

      - name: 4/20 构建 libffi（make ffi）
        working-directory: limbo-app/src/main/jni
        run: |
          set -o pipefail
          make ffi 2>&1 | tee "$LOGDIR/04-ffi.log"

      - name: 5/20 配置 glib（make config-glib）
        working-directory: limbo-app/src/main/jni
        run: |
          set -o pipefail
          make config-glib 2>&1 | tee "$LOGDIR/05-config-glib.log"

      - name: 6/20 构建 glib（make glib）
        working-directory: limbo-app/src/main/jni
        run: |
          set -o pipefail
          make glib 2>&1 | tee "$LOGDIR/06-glib.log"

      - name: 7/20 配置 pixman（make config-pixman）
        working-directory: limbo-app/src/main/jni
        run: |
          set -o pipefail
          make config-pixman 2>&1 | tee "$LOGDIR/07-config-pixman.log"

      - name: 8/20 构建 pixman（make pixman）
        working-directory: limbo-app/src/main/jni
        run: |
          set -o pipefail
          make pixman 2>&1 | tee "$LOGDIR/08-pixman.log"

      - name: 9/20 配置 libslirp（make config-slirp）
        working-directory: limbo-app/src/main/jni
        run: |
          set -o pipefail
          make config-slirp 2>&1 | tee "$LOGDIR/09-config-slirp.log"

      - name: 10/20 构建 libslirp（make slirp）
        working-directory: limbo-app/src/main/jni
        run: |
          set -o pipefail
          make slirp 2>&1 | tee "$LOGDIR/10-slirp.log"

      # IA-64 客户机跳过 spice 栈与 VirGL/virtio-gpu 栈（见 jni/Makefile）：
      # spice 只服务于 qxl-vga，IA-64 的 QEMU 以 --disable-spice 配置。
      - name: 11/20 配置 spice 栈（make config-spice）
        if: env.BUILD_GUEST != 'ia64-softmmu'
        working-directory: limbo-app/src/main/jni
        run: |
          set -o pipefail
          make config-spice 2>&1 | tee "$LOGDIR/11-config-spice.log"

      - name: 12/20 构建 spice 栈（make spice）
        if: env.BUILD_GUEST != 'ia64-softmmu'
        working-directory: limbo-app/src/main/jni
        run: |
          set -o pipefail
          make spice 2>&1 | tee "$LOGDIR/12-spice.log"

      - name: 13/20 配置 GTK4（make config-gtk）
        if: env.USE_GTK == 'true'
        working-directory: limbo-app/src/main/jni
        run: |
          set -o pipefail
          make config-gtk 2>&1 | tee "$LOGDIR/13-config-gtk.log"

      - name: 14/20 构建 GTK4（make gtk）
        if: env.USE_GTK == 'true'
        working-directory: limbo-app/src/main/jni
        run: |
          set -o pipefail
          make gtk 2>&1 | tee "$LOGDIR/14-gtk.log"

      # virglrenderer 依赖 gtk4android 安装出来的 libepoxy，必须排在 gtk 之后。
      - name: 15/20 配置 virglrenderer（make config-virgl）
        if: env.USE_VIRGL == 'true' && env.BUILD_GUEST != 'ia64-softmmu'
        working-directory: limbo-app/src/main/jni
        run: |
          set -o pipefail
          make config-virgl 2>&1 | tee "$LOGDIR/15-config-virgl.log"

      - name: 16/20 构建 virglrenderer（make virgl）
        if: env.USE_VIRGL == 'true' && env.BUILD_GUEST != 'ia64-softmmu'
        working-directory: limbo-app/src/main/jni
        run: |
          set -o pipefail
          make virgl 2>&1 | tee "$LOGDIR/16-virgl.log"

      - name: 17/20 配置 QEMU（make config-qemu）
        working-directory: limbo-app/src/main/jni
        run: |
          set -o pipefail
          make config-qemu 2>&1 | tee "$LOGDIR/17-config-qemu.log"

      - name: 18/20 构建 QEMU 并部署库（make qemu）
        working-directory: limbo-app/src/main/jni
        run: |
          set -o pipefail
          make qemu 2>&1 | tee "$LOGDIR/18-qemu.log"

      - name: 19/20 构建 ncat（make ncat）
        working-directory: limbo-app/src/main/jni
        run: |
          set -o pipefail
          make ncat 2>&1 | tee "$LOGDIR/19-ncat.log"

      - name: 20/20 同步 jniLibs（make install）
        working-directory: limbo-app/src/main/jni
        run: |
          set -o pipefail
          make install 2>&1 | tee "$LOGDIR/20-install.log"

      - name: 上传符号表（obj/symbols）
        uses: actions/upload-artifact@v7.0.1
        with:
          name: symbols-${{ matrix.name }}
          path: limbo-app/src/main/obj/symbols/${{ env.BUILD_HOST }}/
          if-no-files-found: error

      - name: 显示失败阶段的日志尾部
        if: failure()
        run: |
          for log in "$LOGDIR"/*.log; do
            [ -e "$log" ] || continue
            echo "::group::$log（末尾 200 行）"
            tail -200 "$log"
            echo "::endgroup::"
          done

      - name: 上传构建日志（失败诊断用）
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: qemu_build_log-${{ matrix.name }}
          path: ci-logs/

      - name: 解析版本号
        id: version
        env:
          RAW_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          VER="$(printf '%s' "$RAW_VERSION" | tr -d '[:space:]')"
          if ! printf '%s' "$VER" | grep -Eq '^[0-9]+(\.[0-9]+){0,2}$'; then
            echo "ERROR: 版本号需形如 1.2.0（仅数字与点）" >&2
            exit 1
          fi
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VER"
          MAJOR=$((10#${MAJOR:-0}))
          MINOR=$((10#${MINOR:-0}))
          PATCH=$((10#${PATCH:-0}))
          # 与原来的 1.0.0 -> 10000 编码保持一致，保证升级方向正确
          CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          echo "name=$VER" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo ">> version=$VER versionCode=$CODE"

      - name: Gradle 打包 Release
        run: |
          chmod +x ./gradlew
          ./gradlew :limbo-app:assembleRelease \
            -PlimboVersionName="${{ steps.version.outputs.name }}" \
            -PlimboVersionCode="${{ steps.version.outputs.code }}"

      - name: 签名并重命名 APK
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          SDK="$ANDROID_SDK_ROOT"
          BT="$SDK/build-tools/$(ls -1 "$SDK/build-tools" | sort -V | tail -1)"
          APK_DIR="limbo-app/build/outputs/apk/release"
          KS="$RUNNER_TEMP/release.jks"

          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
            ALIAS="${KS_ALIAS:-release}"
            STORE_PASS="${KS_STORE_PASS:?配置 RELEASE_KEYSTORE_BASE64 时必须同时配置 RELEASE_KEYSTORE_PASSWORD}"
            KEY_PASS="${KS_KEY_PASS:-$STORE_PASS}"
          else
            echo ">> 未配置 RELEASE_KEYSTORE_BASE64，使用调试密钥签名（仅可安装，不可用于正式升级）"
            ALIAS="androiddebugkey"
            STORE_PASS="android"
            KEY_PASS="android"
            keytool -genkeypair -keystore "$KS" -storetype PKCS12 \
              -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
              -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" >/dev/null 2>&1
          fi

          # Gradle 未配置 signingConfig，默认产出 *-unsigned.apk；有签名配置时优先用已签名包。
          SRC="$(ls "$APK_DIR"/*.apk 2>/dev/null | grep -v -- '-unsigned' | head -1 || true)"
          [ -n "${SRC:-}" ] || SRC="$(ls "$APK_DIR"/*-unsigned.apk 2>/dev/null | head -1 || true)"
          [ -n "${SRC:-}" ] && [ -f "$SRC" ] || { echo "no apk under $APK_DIR"; exit 1; }
          echo ">> 输入 APK：$SRC"

          OUT="Limbo-${{ steps.version.outputs.name }}-${{ matrix.name }}.apk"
          "$BT/zipalign" -f -p 4 "$SRC" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$KS" --ks-key-alias "$ALIAS" \
            --ks-pass "pass:$STORE_PASS" --key-pass "pass:$KEY_PASS" \
            --out "$OUT" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs "$OUT"
          ls -lh "$OUT"

      - name: 上传 APK 构建产物
        uses: actions/upload-artifact@v7.0.1
        with:
          name: apk-${{ matrix.name }}
          path: Limbo-*.apk
          if-no-files-found: error

  release:
    name: 创建 GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出代码（读取 Changelog）
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: 读取更新日志
        id: changelog
        run: |
          set -euo pipefail
          # 发版用 limbo-app/src/main/assets2/Changelog.md 作为 Release 正文。
          # 用 GITHUB_OUTPUT 的 heredoc 多行格式（EOF_MARKER<<MARKER ... MARKER）直接写入，
          # 避免 Markdown 里的 $、反引号、${{ 等特殊字符被 workflow 解析器当表达式求值。
          SRC="limbo-app/src/main/assets2/Changelog.md"
          if [ ! -f "$SRC" ]; then
            echo "ERROR: 更新日志不存在：$SRC" >&2
            exit 1
          fi
          SIZE=$(wc -c < "$SRC")
          echo ">> 读取 $SRC（${SIZE} 字节）"
          {
            echo "content<<CHANGELOG_END"
            cat "$SRC"
            echo "CHANGELOG_END"
          } >> "$GITHUB_OUTPUT"

      - name: 下载全部 APK
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: apk-*
          merge-multiple: true

      - name: 生成校验和
        run: |
          set -euo pipefail
          ls -lh dist
          (cd dist && sha256sum *.apk > checksums.txt)

      - name: 创建 Release 并上传产物
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          # 显式指定目标提交：release 任务没有 checkout 代码，
          # 不指定时 generate-notes 会收到非法的 target_commitish 并报 422。
          target_commitish: ${{ github.sha }}
          name: Limbo ${{ github.event.inputs.version }}
          body: ${{ steps.changelog.outputs.content }}
          files: |
            dist/*.apk
            dist/checksums.txt
          draft: false
          prerelease: false
