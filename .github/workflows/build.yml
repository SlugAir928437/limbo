name: build
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      build_guest:
        description: 'QEMU Emulator type'
        required: true
        default: 'ia64-softmmu'
        type: string
      build_host:
        description: 'Android device type'
        required: true
        default: 'arm64-v8a'
        type: string

jobs:
  build_linux:
    name: Linux Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 检出代码
        uses: actions/checkout@v6
        with:
          submodules: true
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17
      - name: Setup Android SDK Tools
        uses: android-actions/setup-android@v3.2.1
        with:
          packages: 'ndk;25.2.9519653'

      - name: 安装依赖
        run: |
          sudo apt-get install make autoconf automake git binutils python3 \
            libtool-bin pkg-config flex bison gettext texinfo rsync \
            gtk-doc-tools python3-pip ninja-build meson libglib2.0-dev
          # ubuntu-latest 自带的 meson (1.3.2) 太旧: glib 2.89.3 要求 >= 1.4.0
          sudo python3 -m pip install --upgrade 'meson>=1.4.0'
          # verify the host glib tools are present: the Makefile's glib target
          # replaces the Android-ELF tools in the installed bindir with these
          # (fail early instead of mid-build)
          command -v glib-compile-resources glib-compile-schemas glib-genmarshal glib-mkenums gdbus-codegen

      - name: 克隆代码
        env:
          # 防止 git 在遇到认证提示时无限期挂起
          GIT_TERMINAL_PROMPT: '0'
          GIT_HTTP_LOW_SPEED_TIME: '30'
          GIT_HTTP_LOW_SPEED_LIMIT: '1024'
        run: |
          #Make sure you're under the jni directory
          cd ./limbo-android-lib/src/main/jni

          # glib / pixman / libffi are git-ignored in this repo and their
          # source trees are not shipped, so the CI fetches them from the same
          # wrap sources the gtk4android submodule describes:
          #   glib  2.89.3  (wrap-git: gitlab.gnome.org, fixed commit ed3abf0b
          #                  + patches/glib-hack.patch, tracked in this repo)
          #   libffi 3.5.2  (wrap-file: github release tarball)
          #   pixman 0.43.4 (wrap-file: cairographics tarball)

          ##### GET glib
          git init glib
          cd glib
          git remote add origin https://gitlab.gnome.org/GNOME/glib.git
          timeout 120 git fetch --depth 1 --single-branch origin ed3abf0b5221d613a333ed5b118b2f2acc66acd3
          git checkout FETCH_HEAD
          git apply ../patches/glib-hack.patch
          cd ..

          ##### GET libffi
          wget --quiet --timeout=60 https://github.com/libffi/libffi/releases/download/v3.5.2/libffi-3.5.2.tar.gz -P /tmp/ || \
          wget --quiet --timeout=60 https://github.com/libffi/libffi/releases/download/v3.5.2/libffi-3.5.2.tar.gz -P /tmp/
          tar -xzf /tmp/libffi-3.5.2.tar.gz
          mv libffi-3.5.2 libffi

          ##### GET pixman
          wget --quiet --timeout=60 https://www.cairographics.org/releases/pixman-0.43.4.tar.gz -P /tmp/ || \
          wget --quiet --timeout=60 https://github.com/mesonbuild/wrapdb/releases/download/pixman_0.43.4-1/pixman-0.43.4.tar.gz -P /tmp/
          tar -xzf /tmp/pixman-0.43.4.tar.gz
          mv pixman-0.43.4 pixman

          # sanity check: the sources were fetched
          test -f glib/meson.build
          test -f pixman/meson.build
          test -f libffi/configure.ac

          ##### GET SDL2
          wget --quiet --timeout=60 https://www.libsdl.org/release/SDL2-2.0.8.tar.gz -P /tmp/ || \
          wget --quiet --timeout=60 https://www.libsdl.org/release/SDL2-2.0.8.tar.gz -P /tmp/
          tar -xzf /tmp/SDL2-2.0.8.tar.gz
          mv SDL2-2.0.8 SDL2

          cd SDL2
          patch -p1 < ../patches/sdl2-2.0.8.patch

      - name: 缓存 meson wrap 下载 (pcre2 等)
        uses: actions/cache@v4
        with:
          path: ~/.cache/meson
          key: meson-wrap-${{ runner.os }}

      - name: Build QEMU
        run: |
          cd limbo-android-lib/src/main/jni
          export NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/25.2.9519653
          export PATH=$PATH:$NDK_ROOT
          export BUILD_THREADS=$(nproc)
          export BUILD_GUEST=${{ github.event.inputs.build_guest || 'ia64-softmmu' }}
          export BUILD_HOST=${{ github.event.inputs.build_host || 'arm64-v8a' }}
          export USE_GTK=true
          # 完整构建链: ffi -> glib -> pixman -> gtk(gtk4android) -> qemu -> limbo
          make limbo

      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug
      - name: 上传apk构建产物
        uses: actions/upload-artifact@v7.0.1
        with:
          name: build_apk_output.zip
          path: |
            limbo-android-ia64/build/outputs/apk/**/*.apk
            limbo-android-arm/build/outputs/apk/**/*.apk
            limbo-android-x86/build/outputs/apk/**/*.apk
