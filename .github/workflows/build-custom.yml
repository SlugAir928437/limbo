name: build-custom
# 手动触发的自定义构建：QEMU 仓库/分支 + 各项功能开关均由输入决定。
# 与 build.yml 的固定配置不同，这里不跑 push/pull_request。
on:
  workflow_dispatch:
    inputs:
      qemu_repo:
        description: 'QEMU 仓库链接（留空 = SlugAir928437/QEMU）'
        required: false
        default: ''
      qemu_ref:
        description: 'QEMU 分支或标签（留空 = main）'
        required: false
        default: ''
      build_guest:
        description: '模拟架构（可逗号分隔多选）'
        required: true
        default: 'x86_64-softmmu'
        type: choice
        options:
          - 'x86_64-softmmu'
          - 'i386-softmmu'
          - 'aarch64-softmmu'
          - 'arm-softmmu'
          - 'x86_64-softmmu,i386-softmmu,arm-softmmu,aarch64-softmmu'
          - 'ia64-softmmu'
      build_host:
        description: 'Android 设备 ABI'
        required: true
        default: 'arm64-v8a'
        type: choice
        options:
          - armeabi-v7a
          - arm64-v8a
          - x86
          - x86_64
      use_sdl:
        description: 'SDL2 显示后端'
        required: true
        default: 'true'
        type: choice
        options: ['true', 'false']
      use_gtk:
        description: 'GTK4 显示后端（gtk4android）'
        required: true
        default: 'true'
        type: choice
        options: ['true', 'false']
      use_virgl:
        description: 'VirGL（virtio-gpu-gl-pci，需要 GTK4）'
        required: true
        default: 'true'
        type: choice
        options: ['true', 'false']
      use_virgl_venus:
        description: 'VirGL Venus（Vulkan over VirGL）'
        required: true
        default: 'true'
        type: choice
        options: ['true', 'false']
      use_spice:
        description: 'SPICE（spice-server + qxl-vga）'
        required: true
        default: 'true'
        type: choice
        options: ['true', 'false']
      use_edk2:
        description: 'EDK2 客户机 UEFI 固件'
        required: true
        default: 'false'
        type: choice
        options: ['false', 'true']

jobs:
  build:
    name: custom build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      BUILD_GUEST: ${{ github.event.inputs.build_guest }}
      BUILD_HOST: ${{ github.event.inputs.build_host }}
      USE_SDL: ${{ github.event.inputs.use_sdl }}
      USE_GTK: ${{ github.event.inputs.use_gtk }}
      USE_VIRGL: ${{ github.event.inputs.use_virgl }}
      USE_VIRGL_VENUS: ${{ github.event.inputs.use_virgl_venus }}
      USE_SPICE: ${{ github.event.inputs.use_spice }}
      USE_EDK2: ${{ github.event.inputs.use_edk2 }}
      LOGDIR: ${{ github.workspace }}/ci-logs
    steps:
      - name: 检出代码
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Android SDK Tools
        uses: android-actions/setup-android@v3.2.1
        with:
          packages: 'ndk;28.2.13676358'

      - name: 安装依赖
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          for i in 1 2 3; do
            sudo -E apt-get update -y && break
            echo ">> apt-get update 第 ${i} 次失败，5s 后重试"
            sleep 5
          done
          sudo -E apt-get install -y --fix-missing \
            make autoconf automake git binutils python3 \
            libtool-bin pkg-config flex bison gettext texinfo rsync patch \
            gtk-doc-tools python3-pip ninja-build meson libglib2.0-dev \
            nasm acpica-tools uuid-dev device-tree-compiler gcc-multilib
          if [ "$USE_EDK2" = "true" ]; then
            sudo -E apt-get install -y --fix-missing gcc-aarch64-linux-gnu || true
            sudo -E apt-get install -y --fix-missing gcc-arm-linux-gnueabi \
              || sudo -E apt-get install -y --fix-missing gcc-arm-linux-gnueabihf || true
          fi
          sudo python3 -m pip install --upgrade 'meson>=1.4.0'
          command -v glib-compile-resources glib-compile-schemas glib-genmarshal glib-mkenums gdbus-codegen

      # actions/cache 的 key 不允许逗号，先把多客户机列表转成 slug
      - name: 生成缓存 key 片段
        run: echo "GUEST_SLUG=${BUILD_GUEST//,/-}" >> "$GITHUB_ENV"

      - name: 缓存 meson wrap 下载
        uses: actions/cache@v4
        with:
          path: ~/.cache/meson
          key: meson-wrap-${{ runner.os }}-custom-${{ env.GUEST_SLUG }}

      - name: 解析 QEMU 仓库与功能开关
        env:
          INPUT_QEMU_REPO: ${{ github.event.inputs.qemu_repo }}
          INPUT_QEMU_REF: ${{ github.event.inputs.qemu_ref }}
        run: |
          # 自定义仓库/分支同时写给 official 与 ia64 fork 两个变量，
          # 由 Makefile 按 BUILD_GUEST 选用其中一个。
          repo=$(printf '%s' "$INPUT_QEMU_REPO" | tr -d '\r\n')
          ref=$(printf '%s' "$INPUT_QEMU_REF" | tr -d '\r\n')
          if [ -n "$repo" ]; then
            echo "QEMU_OFFICIAL_URL=$repo" >> "$GITHUB_ENV"
            echo "QEMU_FORK_URL=$repo" >> "$GITHUB_ENV"
          fi
          if [ -n "$ref" ]; then
            echo "QEMU_OFFICIAL_BRANCH=$ref" >> "$GITHUB_ENV"
            echo "QEMU_FORK_BRANCH=$ref" >> "$GITHUB_ENV"
          fi

          # IA-64 fork 没有 VirGL / SPICE，Makefile 会强制关闭，这里同步，
          # 免得后面的步骤还去跑对应的依赖构建。
          if [ "${BUILD_GUEST#*ia64}" != "$BUILD_GUEST" ]; then
            echo "USE_VIRGL=false" >> "$GITHUB_ENV"
            echo "USE_SPICE=false" >> "$GITHUB_ENV"
          fi

          echo ">> QEMU_REPO=${repo:-<default>} QEMU_REF=${ref:-<default>}"
          echo ">> BUILD_GUEST=$BUILD_GUEST BUILD_HOST=$BUILD_HOST"
          echo ">> SDL=$USE_SDL GTK=$USE_GTK VIRGL=$USE_VIRGL VENUS=$USE_VIRGL_VENUS SPICE=$USE_SPICE EDK2=$USE_EDK2"

      - name: 校验开关组合
        run: |
          if [ "$USE_VIRGL" = "true" ] && [ "$USE_GTK" != "true" ]; then
            echo "::error::VirGL 需要 gtk4android 提供的 libepoxy，USE_VIRGL=true 时必须同时启用 GTK4。"
            exit 1
          fi
          if [ "$USE_VIRGL_VENUS" = "true" ] && [ "$USE_VIRGL" != "true" ]; then
            echo "::warning::USE_VIRGL=false，Venus 开关不会生效。"
          fi

      - name: 准备构建环境
        run: |
          NDK_VERSION=28.2.13676358
          echo "NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "BUILD_THREADS=$(nproc)" >> "$GITHUB_ENV"
          echo "PATH=$PATH:${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          mkdir -p "$LOGDIR"

      - name: 1/20 拉取源码（make fetch）
        working-directory: limbo-app/src/main/jni
        run: |
          set -o pipefail
          make fetch 2>&1 | tee "$LOGDIR/01-fetch.log"

      - name: 2/20 生成 NDK 中间目录（make ndk）
        working-directory: limbo-app/src/main/jni
        run: |
          set -o pipefail
          make ndk 2>&1 | tee "$LOGDIR/02-ndk.log"

      - name: 3/20 配置 libffi
        working-directory: limbo-app/src/main/jni
        run: |
          set -o pipefail
          make config-ffi 2>&1 | tee "$LOGDIR/03-config-ffi.log"

      - name: 4/20 构建 libffi
        working-directory: limbo-app/src/main/jni
        run: |
          set -o pipefail
          make ffi 2>&1 | tee "$LOGDIR/04-ffi.log"

      - name: 5/20 配置 glib
        working-directory: limbo-app/src/main/jni
        run: |
          set -o pipefail
          make config-glib 2>&1 | tee "$LOGDIR/05-config-glib.log"

      - name: 6/20 构建 glib
        working-directory: limbo-app/src/main/jni
        run: |
          set -o pipefail
          make glib 2>&1 | tee "$LOGDIR/06-glib.log"

      - name: 7/20 配置 pixman
        working-directory: limbo-app/src/main/jni
        run: |
          set -o pipefail
          make config-pixman 2>&1 | tee "$LOGDIR/07-config-pixman.log"

      - name: 8/20 构建 pixman
        working-directory: limbo-app/src/main/jni
        run: |
          set -o pipefail
          make pixman 2>&1 | tee "$LOGDIR/08-pixman.log"

      - name: 9/20 配置 libslirp
        working-directory: limbo-app/src/main/jni
        run: |
          set -o pipefail
          make config-slirp 2>&1 | tee "$LOGDIR/09-config-slirp.log"

      - name: 10/20 构建 libslirp
        working-directory: limbo-app/src/main/jni
        run: |
          set -o pipefail
          make slirp 2>&1 | tee "$LOGDIR/10-slirp.log"

      - name: 11/20 配置 spice 栈
        if: env.USE_SPICE == 'true' && env.BUILD_GUEST != 'ia64-softmmu'
        working-directory: limbo-app/src/main/jni
        run: |
          set -o pipefail
          make config-spice 2>&1 | tee "$LOGDIR/11-config-spice.log"

      - name: 12/20 构建 spice 栈
        if: env.USE_SPICE == 'true' && env.BUILD_GUEST != 'ia64-softmmu'
        working-directory: limbo-app/src/main/jni
        run: |
          set -o pipefail
          make spice 2>&1 | tee "$LOGDIR/12-spice.log"

      - name: 13/20 配置 GTK4
        if: env.USE_GTK == 'true'
        working-directory: limbo-app/src/main/jni
        run: |
          set -o pipefail
          make config-gtk 2>&1 | tee "$LOGDIR/13-config-gtk.log"

      - name: 14/20 构建 GTK4
        if: env.USE_GTK == 'true'
        working-directory: limbo-app/src/main/jni
        run: |
          set -o pipefail
          make gtk 2>&1 | tee "$LOGDIR/14-gtk.log"

      - name: 15/20 配置 virglrenderer
        if: env.USE_VIRGL == 'true' && env.BUILD_GUEST != 'ia64-softmmu'
        working-directory: limbo-app/src/main/jni
        run: |
          set -o pipefail
          make config-virgl 2>&1 | tee "$LOGDIR/15-config-virgl.log"

      - name: 16/20 构建 virglrenderer
        if: env.USE_VIRGL == 'true' && env.BUILD_GUEST != 'ia64-softmmu'
        working-directory: limbo-app/src/main/jni
        run: |
          set -o pipefail
          make virgl 2>&1 | tee "$LOGDIR/16-virgl.log"

      - name: 17/20 配置 QEMU
        working-directory: limbo-app/src/main/jni
        run: |
          set -o pipefail
          make config-qemu 2>&1 | tee "$LOGDIR/17-config-qemu.log"

      - name: 18/20 构建 QEMU 并部署库
        working-directory: limbo-app/src/main/jni
        run: |
          set -o pipefail
          make qemu 2>&1 | tee "$LOGDIR/18-qemu.log"

      - name: 19/20 构建 ncat
        working-directory: limbo-app/src/main/jni
        run: |
          set -o pipefail
          make ncat 2>&1 | tee "$LOGDIR/19-ncat.log"

      - name: 20/20 同步 jniLibs
        working-directory: limbo-app/src/main/jni
        run: |
          set -o pipefail
          make install 2>&1 | tee "$LOGDIR/20-install.log"

      - name: 构建 EDK2 客户机固件
        if: env.USE_EDK2 == 'true'
        working-directory: limbo-app/src/main/jni
        run: |
          set -o pipefail
          make edk2 2>&1 | tee "$LOGDIR/21-edk2.log"

      - name: 上传符号表
        uses: actions/upload-artifact@v7.0.1
        with:
          name: symbols-custom-${{ env.BUILD_HOST }}
          path: limbo-app/src/main/obj/symbols/${{ env.BUILD_HOST }}/
          if-no-files-found: error

      - name: 显示失败阶段的日志尾部
        if: failure()
        run: |
          for log in "$LOGDIR"/*.log; do
            [ -e "$log" ] || continue
            echo "::group::$log（末尾 200 行）"
            tail -200 "$log"
            echo "::endgroup::"
          done

      - name: 上传构建日志（失败诊断用）
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: qemu_build_log-custom
          path: ci-logs/

      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: 上传apk构建产物
        uses: actions/upload-artifact@v7.0.1
        with:
          name: build_apk_output-custom.zip
          path: |
            limbo-app/build/outputs/apk/**/*.apk
